<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>India, screen by screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=Noto+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; gap: 48px; width: 4850px; height: 964px; box-sizing: border-box; padding: 40px; background: #F1E6DF; font-family: Figtree, system-ui, sans-serif; color: #2A2135">
  <sc-for list="{{ screens }}" as="x" hint-placeholder-count="11">
    <div style="display: flex; flex-direction: column; gap: 12px; width: 390px; flex: none">
      <div style="height: 28px; font-size: 18px; font-weight: 700; white-space: nowrap">{{ x.caption }}</div>
      <div style="width: 390px; height: 844px; overflow: hidden; border-radius: 36px; box-shadow: 0 10px 30px rgba(42, 33, 53, 0.16)">
        <dc-import name="Main" start="{{ x.start }}" country="India" registered="{{ x.reg }}" hint-size="390px,844px"></dc-import>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":4850,"height":964}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      screens: [
        { caption: '1 · Pick a look', start: 'look', reg: true },
        { caption: '2 · Your business name', start: 'name', reg: true },
        { caption: '4 · One tax question (has a GSTIN)', start: 'tax', reg: true },
        { caption: '5 · Who it is for', start: 'client', reg: true },
        { caption: '6 · Items, with GST', start: 'items', reg: true },
        { caption: '6 · Items, no GSTIN: no GST anywhere', start: 'items', reg: false },
        { caption: '7 · When they pay', start: 'when', reg: true },
        { caption: '8 · How they pay (optional)', start: 'pay', reg: true },
        { caption: '9 · Looks good?', start: 'review', reg: true },
        { caption: '10 · Sent', start: 'sent', reg: true },
        { caption: 'Next invoice: just 3 steps', start: 'repeat', reg: true }
      ]
    };
  }
}
</script>
</body>
</html>
