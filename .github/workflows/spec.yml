name: spec

# Runs when the spec changes, and whenever an app core module changes (its bundled spec copy must stay in sync).
on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "ios/Packages/InvoiceCore/**"
      - "ios/Packages/InvoiceData/**"
      - "android/core/domain/**"
      - ".github/workflows/spec.yml"
      - "Makefile"
  pull_request:
    paths:
      - "spec/**"
      - "ios/Packages/InvoiceCore/**"
      - "ios/Packages/InvoiceData/**"
      - "android/core/domain/**"
      - ".github/workflows/spec.yml"
      - "Makefile"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spec/tools/package-lock.json
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: make setup
      - run: make validate-spec
      - run: make check-sync
