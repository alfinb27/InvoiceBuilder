name: ios

# InvoiceCore and InvoiceData run on macOS without a simulator (fast); InvoiceUI and the app's UI smoke tests run on
# the first available iPhone simulator of the runner image. Runs on pull requests and pushes to main only: macOS
# minutes count 10x against a private repository's Actions allowance.
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "spec/**"
      - ".github/workflows/ios.yml"
      - "Makefile"
  pull_request:
    paths:
      - "ios/**"
      - "spec/**"
      - ".github/workflows/ios.yml"
      - "Makefile"
  workflow_dispatch:

jobs:
  test:
    # macos-26 (Xcode 26.6, iOS 26 simulators), closer to the local Xcode than macos-15's default Xcode 16.4; the
    # SQLiteData dependencies that phase-4b adds need Swift tools >= 6.2 anyway.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Core (every implemented fixture) and data tests
        run: |
          make test-core-ios
          make test-data-ios
      - name: Pick a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)?' || true)
          echo "Using simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # Boot it now and wait: a cold first boot during the UI tests drops taps and measures half-drawn screens.
          xcrun simctl boot "$name" || true
          xcrun simctl bootstatus "$name" -b
      - name: PDF renderer tests
        run: make test-pdf-ios SIM="${{ steps.sim.outputs.name }}"
      - name: InvoiceUI view-model tests
        run: make test-ui-ios SIM="${{ steps.sim.outputs.name }}"
      - name: App UI smoke tests
        run: make test-app-ios SIM="${{ steps.sim.outputs.name }}"
      # A failed simulator test leaves its result bundle (logs, the failing screen, the accessibility tree) in
      # DerivedData: keep it, so a CI-only failure can be read instead of guessed at.
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
          retention-days: 7
