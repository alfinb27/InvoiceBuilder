name: android

# The Android port (Phase 7). Runs on Ubuntu (cheap minutes): every spec fixture against :core:domain on the JVM,
# plus the unit tests of the other modules as they arrive.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "spec/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "spec/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundled spec copies are current
        run: spec/tools/sync-spec.sh --check
      - name: Core fixtures (JVM)
        working-directory: android
        run: ./gradlew :core:domain:test --console=plain
