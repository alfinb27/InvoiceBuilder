name: android

# The Android port (Phase 7). Runs on Ubuntu (cheap minutes): every spec fixture against :core:domain on the JVM,
# the other modules' unit tests, Android Lint and the R8 release build; then, on an emulator, the PDF renderer and the
# app's UI smoke tests.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "spec/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "spec/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundled spec copies are current
        run: spec/tools/sync-spec.sh --check
      - name: Core fixtures (JVM)
        working-directory: android
        run: ./gradlew :core:domain:test --console=plain
      - name: Data layer (Robolectric), billing, Lint and the R8 release build
        working-directory: android
        run: ./gradlew testDebugUnitTest :app:lintDebug :app:assembleRelease --console=plain

  device:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: PDF renderer and UI smoke tests (API 36 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          working-directory: android
          script: ./gradlew :core:pdf:connectedDebugAndroidTest :app:connectedDebugAndroidTest --console=plain
