name: android

# The Android port (Phase 7), on Ubuntu (1x minutes): every spec fixture against :core:domain on the JVM, the other
# modules' unit tests, Android Lint and the R8 release build, on pull requests (~6 minutes). The emulator tests (PDF
# renderer, UI smoke tests; ~7 minutes) run on demand — Actions → android → Run workflow — or on a pull request
# labelled `device-test`; locally: `make test-device-android`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "android/**"
      - "spec/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      device:
        description: "Also run the emulator tests (PDF renderer, UI smoke tests)"
        type: boolean
        default: true

# A newer push to the same branch cancels the run in progress (no minutes spent on superseded commits).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundled spec copies are current
        run: spec/tools/sync-spec.sh --check
      - name: Core fixtures (JVM)
        working-directory: android
        run: ./gradlew :core:domain:test --console=plain
      - name: Data layer (Robolectric), billing, Lint and the R8 release build
        working-directory: android
        run: ./gradlew testDebugUnitTest :app:lintDebug :app:assembleRelease --console=plain

  device:
    needs: test
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.device) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'device-test'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: PDF renderer and UI smoke tests (API 36 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          working-directory: android
          script: ./gradlew :core:pdf:connectedDebugAndroidTest :app:connectedDebugAndroidTest --console=plain
      # Name the failing test instead of guessing: the Gradle log only says "There were failing tests".
      - name: Keep the device test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-tests
          path: |
            android/app/build/reports/androidTests
            android/core/pdf/build/reports/androidTests
          retention-days: 7
