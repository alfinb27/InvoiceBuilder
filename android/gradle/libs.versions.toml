# Every dependency version in one place (≈ pinned versions in Package.resolved).
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
kotlinx-serialization = "1.11.0"
junit = "6.1.3"
junit4 = "4.13.2"
coroutines = "1.11.0"
room = "2.8.5"
robolectric = "4.17"
androidx-test-core = "1.7.0"
turbine = "1.2.1"
zxing = "3.5.4"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
core-ktx = "1.19.1"
work = "2.12.0"
billing = "9.1.0"
blockstore = "16.4.0"
androidx-test-ext = "1.3.0"
androidx-test-runner = "1.7.0"
icons-extended = "1.7.8"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
